<!DOCTYPE html>
<html lang="zh-TW" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Markdown & Mermaid Web Viewer 是一套基於 Linear 設計風格的純前端 Markdown 與 Mermaid 即時預覽工具，具備雙向滾動同步、AI 格式修復與多格式匯出等功能。">
    <meta name="theme-color" content="#0F1011" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Markdown Viewer" />
    <title>Markdown & Mermaid Web Viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      window.addEventListener('load', function() {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap';
        document.head.appendChild(link);
      });
    </script>
  </head>
  <body>
    <div id="app" class="app-root">
      <!-- 頂部工具列 (Top Toolbar) -->
      <header class="app-header">
        <!-- 列 1：品牌標題、檔名與三態版面切換器（桌面版為左側與最右側） -->
        <div class="header-row header-row-primary">
          <div class="brand-group">
            <div class="brand">
              <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
              </svg>
              <span class="brand-name">Markdown Viewer</span>
            </div>

            <div class="doc-title-wrapper">
              <input type="text" id="doc-title-input" class="doc-title-input" value="Untitled.md" spellcheck="false" title="點擊修改檔案名稱" aria-label="文件檔案名稱" />
            </div>
          </div>

          <!-- Linear 三態切換器 (Alt+1 / Alt+2 / Alt+3) -->
          <div class="segmented-control" role="group" aria-label="版面配置切換">
            <div class="segmented-indicator" id="segmented-indicator"></div>
            <button id="btn-layout-editor" class="segment-btn" data-layout="editor" title="純編輯模式 (快捷鍵: Alt+1)" aria-label="切換至純編輯模式 (Alt+1)">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              <span>純編輯</span>
            </button>
            <button id="btn-layout-split" class="segment-btn active" data-layout="split" title="雙欄對照模式 (快捷鍵: Alt+2)" aria-label="切換至雙欄對照模式 (Alt+2)">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
              <span>雙欄對照</span>
            </button>
            <button id="btn-layout-preview" class="segment-btn" data-layout="preview" title="純瀏覽模式 (快捷鍵: Alt+3)" aria-label="切換至純瀏覽模式 (Alt+3)">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span>純瀏覽</span>
            </button>
          </div>
        </div>

        <!-- 列 2：編輯操作工具列與主題/匯出控制（桌面版融入為單行工具列） -->
        <div class="header-row header-row-secondary">
          <div class="header-actions">
            <button id="btn-fix" class="action-btn" title="自動修復 Markdown 排版與中斷表格 (快捷鍵: Alt+F)">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
              <span>修正</span>
            </button>
            <button id="btn-sample" class="action-btn" title="載入範例模板" aria-label="載入範例模板">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
              <span>範例</span>
            </button>
            <button id="btn-import" class="action-btn" title="開啟本機 Markdown 檔案" aria-label="開啟本機檔案">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span>開啟</span>
            </button>
            <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display: none;" aria-label="選擇 Markdown 檔案" />
            <button id="btn-copy" class="action-btn" title="複製 Markdown 原始碼" aria-label="複製 Markdown 原始碼">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>複製</span>
            </button>
            <button id="btn-clear" class="action-btn action-btn-danger" title="清空編輯器" aria-label="清空編輯器">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              <span>清空</span>
            </button>
          </div>

          <div class="header-controls">
            <!-- 主題切換按鈕 -->
            <button id="btn-theme-toggle" class="action-btn theme-toggle-btn" title="切換淺色/深色主題 (快捷鍵: Alt+T)" aria-label="切換深色與淺色主題 (Alt+T)">
              <svg id="theme-icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
              <svg id="theme-icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>

            <!-- 匯出下拉選單 -->
            <div class="dropdown-wrapper">
              <button id="btn-export-dropdown" class="btn-primary" aria-expanded="false" aria-haspopup="true" aria-label="匯出檔案選單">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span class="btn-export-text">匯出</span>
                <svg class="chevron-icon" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div id="export-menu" class="dropdown-menu" hidden>
                <button class="dropdown-item" data-export="md">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="13" x2="8" y2="17"></line><line x1="12" y1="13" x2="16" y2="17"></line></svg>
                  <div class="item-text">
                    <span class="item-title">匯出 Markdown (.md)</span>
                    <span class="item-desc">標準純文字格式，適用各編輯器</span>
                  </div>
                </button>
                <button class="dropdown-item" data-export="html">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                  <div class="item-text">
                    <span class="item-title">匯出 HTML (.html)</span>
                    <span class="item-desc">獨立自給單一檔案，含樣式與向量圖</span>
                  </div>
                </button>
                <button class="dropdown-item" data-export="pdf">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path></svg>
                  <div class="item-text">
                    <span class="item-title">列印 / 匯出 PDF (.pdf)</span>
                    <span class="item-desc">高解析列印級無損排版</span>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- 主工作區 (Workspace) -->
      <main id="app-workspace" class="workspace" data-layout="split">
        <!-- 編輯區 (Editor Pane) -->
        <section id="editor-pane" class="editor-pane">
          <div class="pane-header">
            <div class="pane-title">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
              <span>Markdown 原始碼</span>
            </div>
            <div class="pane-actions">
              <button id="btn-editor-wrap" class="pane-btn active" title="自動換行切換" aria-label="切換自動換行">自動換行</button>
            </div>
          </div>
          <div id="codemirror-mount" class="editor-mount"></div>
        </section>

        <!-- 拖曳分隔條 (Divider Resizer) -->
        <div id="pane-resizer" class="pane-resizer" title="拖曳調整左右欄寬度">
          <div class="resizer-handle"></div>
        </div>

        <!-- 預覽區 (Preview Pane) -->
        <section id="preview-pane" class="preview-pane">
          <div class="pane-header">
            <div class="pane-title">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
              <span>即時預覽</span>
            </div>
            <div class="pane-actions">
              <span id="render-indicator" class="render-indicator" title="渲染狀態">
                <span class="status-dot"></span>
                <span class="status-text">已同步</span>
              </span>
            </div>
          </div>
          <div id="preview-scroll-container" class="preview-scroll-container">
            <article id="preview-content" class="markdown-body"><div class="empty-placeholder">開始輸入 Markdown 內容...</div></article>
          </div>
        </section>
      </main>

      <!-- 底部狀態列 (Status Bar) -->
      <footer id="app-statusbar" class="app-statusbar">
        <div class="status-left">
          <span class="status-item" id="stat-lines">0 行</span>
          <span class="status-divider">/</span>
          <span class="status-item" id="stat-words">0 字</span>
          <span class="status-divider">/</span>
          <span class="status-item" id="stat-chars">0 字元</span>
          <span class="status-divider">/</span>
          <span class="status-item" id="stat-cursor">行 1, 欄 1</span>
        </div>

        <div class="status-center">
          <span class="status-badge" title="本應用採用純記憶體生命週期，關閉分頁或重整將立即抹除，零本機殘留">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>無痕暫態模式 (Zero-Persistence)</span>
          </span>
        </div>

        <div class="status-right">
          <button id="btn-toggle-sync-scroll" class="status-btn active" title="切換雙向等比滾動同步">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 11 12 6 17 11"></polyline><polyline points="17 13 12 18 7 13"></polyline></svg>
            <span>滾動同步：開</span>
          </button>
          <span class="status-item">UTF-8</span>
        </div>
      </footer>

      <!-- 提示訊息 Toast 容器 -->
      <div id="toast-container" class="toast-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
